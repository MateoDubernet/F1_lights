version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=f1_lights
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./f1_lights_bdd.sql:/docker-entrypoint-initdb.d/f1_lights_bdd.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=f1_lights
      - DB_PORT=3306

  frontend:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - backend